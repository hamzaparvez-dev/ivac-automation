services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/ivac_automation
      # Required for production boot:
      - JWT_SECRET=change-me
      - OTP_WEBHOOK_SECRET=change-me
      - TWOCAPTCHA_API_KEY=change-me
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - mongo

volumes:
  mongo_data:

